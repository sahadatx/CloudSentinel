[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsentinel"
version = "0.1.0"
description = "CloudSentinel platform foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "boto3>=1.35,<2",
    "cryptography>=43,<48",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "PyJWT>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.21,<1",
    "python3-saml>=1.16,<2",
    "python-multipart>=0.0.18,<1",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2",
    "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<1",
    "opentelemetry-instrumentation-redis>=0.50b0,<1",
    "opentelemetry-instrumentation-celery>=0.50b0,<1",
    "pyotp>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pwdlib[argon2]>=0.2,<1",
    "redis>=5,<7",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.8,<2",
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]
security = [
    "semgrep>=1.100,<2",
]

[tool.setuptools.packages.find]
where = ["backend", "scanner-engine", "policy-engine"]
include = ["app*", "cloudsentinel_scanner*", "cloudsentinel_policy*"]

[tool.setuptools.package-data]
cloudsentinel_policy = ["rules/aws/*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "scanner-engine", "policy-engine"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "scanner-engine", "policy-engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend:scanner-engine:policy-engine"
files = ["backend/app", "backend/tests"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
    module = ["boto3.*", "botocore.*", "celery.*", "prometheus_client", "pyotp"]
ignore_missing_imports = true

apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudsentinel-otel-collector
  namespace: cloudsentinel
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
      batch:
        timeout: 5s
        send_batch_size: 512
    exporters:
      awsxray:
        region: ${env:AWS_REGION}
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [awsxray]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsentinel-otel-collector
  namespace: cloudsentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudsentinel-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudsentinel-otel-collector
    spec:
      serviceAccountName: cloudsentinel-otel-collector
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: public.ecr.aws/aws-observability/aws-otel-collector:v0.43.3
          args: ["--config=/etc/otel/config.yaml"]
          env:
            - name: AWS_REGION
              value: REPLACE_WITH_AWS_REGION
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: cloudsentinel-otel-collector
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudsentinel-otel-collector
  namespace: cloudsentinel
spec:
  selector:
    app.kubernetes.io/name: cloudsentinel-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc

apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: cloudsentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outbox-relay
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      serviceAccountName: cloudsentinel-outbox
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outbox-relay
          image: cloudsentinel/backend:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.task_outbox"]
          envFrom:
            - secretRef:
                name: cloudsentinel-runtime
          env:
            - name: CLOUDSENTINEL_APP_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: cloudsentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      serviceAccountName: cloudsentinel-worker
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: cloudsentinel/backend:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.core.celery_app:celery_app
            - worker
            - --loglevel=INFO
            - --concurrency=4
            - --max-tasks-per-child=100
            - --hostname=cloudsentinel-worker@%h
          envFrom:
            - secretRef:
                name: cloudsentinel-runtime
          env:
            - name: CLOUDSENTINEL_APP_ENV
              value: production
            - name: CLOUDSENTINEL_OTEL_ENDPOINT
              value: cloudsentinel-otel-collector.cloudsentinel.svc.cluster.local:4317
            - name: CLOUDSENTINEL_OTEL_SAMPLE_RATIO
              value: "0.1"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: ["python", "-m", "app.worker_healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-m", "app.worker_healthcheck"]
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

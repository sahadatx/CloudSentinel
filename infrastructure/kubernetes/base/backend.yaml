apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cloudsentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      automountServiceAccountToken: false
      serviceAccountName: cloudsentinel-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: cloudsentinel/backend:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: cloudsentinel-runtime
          env:
            - name: CLOUDSENTINEL_APP_ENV
              value: production
            - name: CLOUDSENTINEL_API_HOST
              value: 0.0.0.0
            - name: CLOUDSENTINEL_OTEL_ENDPOINT
              value: cloudsentinel-otel-collector.cloudsentinel.svc.cluster.local:4317
            - name: CLOUDSENTINEL_OTEL_SAMPLE_RATIO
              value: "0.1"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cloudsentinel
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http

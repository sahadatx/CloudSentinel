apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudsentinel-release-deployer
  namespace: cloudsentinel
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudsentinel-release-deployer
  namespace: cloudsentinel
subjects:
  - kind: Group
    name: cloudsentinel-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cloudsentinel-release-deployer
  apiGroup: rbac.authorization.k8s.io

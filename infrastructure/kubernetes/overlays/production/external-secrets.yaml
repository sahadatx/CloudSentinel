apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cloudsentinel-aws-secrets
  namespace: cloudsentinel
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_WITH_AWS_REGION
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudsentinel-runtime
  namespace: cloudsentinel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cloudsentinel-aws-secrets
    kind: SecretStore
  target:
    name: cloudsentinel-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: cloudsentinel/production/runtime
